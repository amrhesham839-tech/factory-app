<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>نظام إدارة المصنع</title>
<style>
  :root {
    --ink: #17232E; --muted: #5B6B78; --paper: #EEF2F4; --card: #FFFFFF; --line: #D5DDE2;
    --brand: #0F5C73; --brand-dark: #0A4456; --on-brand: #FFFFFF;
    --warn: #8A5200; --warn-bg: #FFF1D6; --danger: #B3261E; --danger-bg: #FDE7E5;
    --ok: #1F7A4D; --ok-bg: #E2F4EA;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
    font-size: 16px; line-height: 1.6;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  h1, h2, h3 { margin: 0; line-height: 1.3; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #F2A900; outline-offset: 2px; }

  /* العلامة المميزة: خط الغرزة */
  .stitch { border: 0; border-top: 2px dashed var(--brand); margin: 0; }

  .topbar { background: var(--card); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; color: var(--brand); }
  .who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .who strong { color: var(--ink); font-weight: 600; }

  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-head h2 { font-size: 22px; }

  .btn { min-height: 44px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--brand); }
  .btn.ghost:hover { background: #E3EFF3; }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: var(--danger-bg); }
  .btn.small { min-height: 38px; padding: 4px 12px; font-size: 14px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px 16px; }
  .login-card { width: 100%; max-width: 400px; padding: 28px 24px; border: 2px dashed var(--brand); background: var(--card); border-radius: 14px; }
  .login-card h1 { font-size: 24px; margin-bottom: 4px; color: var(--brand); }
  .login-card p.lead { margin: 0 0 20px; color: var(--muted); font-size: 15px; }

  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input[type=text], input[type=password], select {
    width: 100%; min-height: 46px; padding: 8px 12px; border: 1px solid #A9B7C0; border-radius: 8px; background: #fff;
  }
  input[dir=ltr] { text-align: left; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .form-actions .btn { flex: 1 1 140px; }

  .msg { padding: 10px 14px; border-radius: 8px; margin: 14px 0 0; font-size: 15px; }
  .msg.error { background: var(--danger-bg); color: #7A1913; }
  .msg.ok { background: var(--ok-bg); color: #14543A; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }

  .user-list { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .user { padding: 14px 16px; display: grid; gap: 10px; }
  .user-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .user-name { font-weight: 600; font-size: 17px; }
  .user-sub { color: var(--muted); font-size: 14px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .badge.on { background: var(--ok-bg); color: var(--ok); }
  .badge.off { background: #E8ECEF; color: #46545F; }
  .badge.wait { background: var(--warn-bg); color: var(--warn); }
  .user-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .user-actions select { width: auto; min-width: 150px; min-height: 38px; padding: 2px 10px; }
  .empty { padding: 28px 18px; text-align: center; color: var(--muted); }

  dialog { border: 0; border-radius: 14px; padding: 0; width: min(92vw, 440px); color: var(--ink); }
  dialog::backdrop { background: rgba(23, 35, 46, .55); }
  .dlg { padding: 22px 22px 20px; }
  .dlg h3 { font-size: 20px; margin-bottom: 4px; }

  .toast { position: fixed; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 520px; margin-inline: auto; z-index: 50; }
  .center-note { max-width: 520px; margin: 40px auto; padding: 24px; text-align: center; }
  @media (prefers-reduced-motion: no-preference) { .btn { transition: background-color .15s; } }

  .tabs { max-width: 960px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
  .tab { min-height: 44px; padding: 8px 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--brand); }
  .tab[aria-current="page"] { color: var(--brand); border-bottom-color: var(--brand); }
</style>

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3Y2xycGJydmNzanVkdXppbXd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MDA1MjYsImV4cCI6MjEwNzM3NjUyNn0.Jo0iwsUqesTwUDVv4flIHX19NiTISwY8VSqzdPBd4SI";

/* ---------- عميل اتصال مدمج (بدون مكتبات خارجية) ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem("sf_session") || "null"); } catch (_) { return null; } },
  set(v) { try { if (v) localStorage.setItem("sf_session", JSON.stringify(v)); else localStorage.removeItem("sf_session"); } catch (_) {} }
};
let cur = store.get();
const pack = (j) => ({ access_token: j.access_token, refresh_token: j.refresh_token,
  expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user.id, email: j.user.email } });
async function authPost(path, body) {
  const res = await fetch(SUPABASE_URL + path, { method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY }, body: JSON.stringify(body) });
  let json = null; try { json = await res.json(); } catch (_) {}
  return { ok: res.ok, status: res.status, json };
}
async function refreshSession() {
  if (!cur || !cur.refresh_token) return;
  try {
    const r = await authPost("/auth/v1/token?grant_type=refresh_token", { refresh_token: cur.refresh_token });
    if (r.ok && r.json && r.json.access_token) { cur = pack(r.json); store.set(cur); }
    else if (r.status >= 400 && r.status < 500) { cur = null; store.set(null); }
  } catch (_) {}
}
async function accessToken() {
  if (cur && cur.expires_at - 60 < Date.now() / 1000) await refreshSession();
  return cur ? cur.access_token : SUPABASE_ANON_KEY;
}
async function restGet(table, q) {
  const params = ["select=" + encodeURIComponent(q.cols)];
  q.filters.forEach(([c, v]) => params.push(c + "=eq." + encodeURIComponent(v)));
  if (q.order) params.push("order=" + q.order.col + "." + (q.order.asc ? "asc" : "desc"));
  try {
    const t = await accessToken();
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?" + params.join("&"), { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + t } });
    let json = null; try { json = await res.json(); } catch (_) {}
    if (!res.ok) return { data: null, error: { message: (json && json.message) || "request failed" } };
    return { data: json, error: null };
  } catch (e) { return { data: null, error: { message: String((e && e.message) || e) } }; }
}
function from(table) {
  const q = { cols: "*", filters: [], order: null, single: false };
  const api = {
    select(c) { q.cols = c; return api; },
    eq(c, v) { q.filters.push([c, v]); return api; },
    order(c, o) { q.order = { col: c, asc: !(o && o.ascending === false) }; return api; },
    maybeSingle() { q.single = true; return api; },
    then(res, rej) {
      return restGet(table, q).then((r) => {
        if (q.single && !r.error) {
          if (!Array.isArray(r.data) || r.data.length > 1) return { data: null, error: { message: "unexpected rows" } };
          return { data: r.data[0] || null, error: null };
        }
        return r;
      }).then(res, rej);
    }
  };
  return api;
}
const sb = {

    async getSession() {
      if (cur && cur.expires_at - 60 < Date.now() / 1000) await refreshSession();

        if (!r.ok || !r.json || !r.json.access_token) {
          return { error: { message: (r.json && (r.json.msg || r.json.error_description || r.json.message)) || "Invalid login credentials", status: r.status } };
        }
        cur = pack(r.json); store.set(cur);
        return { data: { session: cur }, error: null };
      } catch (e) { return { error: { message: "Failed to fetch" } }; }
    },

      try { if (cur) await fetch(SUPABASE_URL + "/auth/v1/logout", { method: "POST", headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + cur.access_token } }); } catch (_) {}
      cur = null; store.set(null);
      return { error: null };
    }
  },
  functions: {
    async invoke(name, opts) {
      try {
        const t = await accessToken();
        const res = await fetch(SUPABASE_URL + "/functions/v1/" + name, { method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + t },
          body: JSON.stringify((opts && opts.body) || {}) });
        if (!res.ok) return { data: null, error: { message: "non-2xx", context: res } };
        let data = null; try { data = await res.json(); } catch (_) {}
        return { data, error: null };
      } catch (e) { return { data: null, error: { message: String((e && e.message) || e) } }; }
    }
  }
};
const appEl = document.getElementById("app");
const toastEl = document.getElementById("toast");
const state = { profile: null, role: null, email: null };


/* ---------- كتابة البيانات (إضافة/تعديل) ---------- */
async function restWrite(method, table, filters, body) {
  const params = filters.map(([c, v]) => c + "=eq." + encodeURIComponent(v)).join("&");
  try {
    const t = await accessToken();
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + (params ? "?" + params : ""), { method,
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + t, Prefer: "return=representation" },
      body: JSON.stringify(body) });
    let json = null; try { json = await res.json(); } catch (_) {}
    if (!res.ok) return { data: null, error: { message: (json && (json.message || json.hint)) || "request failed", code: json && json.code } };
    return { data: json, error: null };
  } catch (e) { return { data: null, error: { message: String((e && e.message) || e) } }; }
}
sb.insert = (table, body) => restWrite("POST", table, [], body);
sb.update = (table, id, body) => restWrite("PATCH", table, [["id", id]], body);
sb.remove = (table, id) => restWrite("DELETE", table, [["id", id]], undefined);

/* ---------- أدوات صغيرة ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function mount(...nodes) { appEl.replaceChildren(...nodes); window.scrollTo(0, 0); }
let toastTimer;
function toast(text, kind) {
  toastEl.replaceChildren(h("div", { class: "msg " + (kind || "ok") }, text));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.replaceChildren(), 7000);
}
const toEmail = (id) => { const v = id.trim().toLowerCase(); return v.includes("@") ? v : v + "@" + EMAIL_DOMAIN; };
const isNetworkError = (e) => !!e && /fetch|network|failed to/i.test(e.message || "");

async function callAdmin(body) {
  const { data, error } = await sb.functions.invoke("admin-users", { body });
  if (error) {
    let msg = "تعذّر الاتصال بالخادم، اتأكد من الإنترنت وجرّب تاني";
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
    return { ok: false, error: msg };
  }
  if (data && data.ok) return { ok: true, data };
  return { ok: false, error: (data && data.error) || "العملية ما اتنفذتش" };
}
function dbMessage(err) {
  const m = (err && err.message) || "";
  if (/profiles_active_needs_role/.test(m)) return "اختار دور للمستخدم قبل ما تفعّله";
  return m || "العملية ما اتنفذتش";
}

/* ---------- الهيكل العام ---------- */

async function logout() { await sb.auth.signOut(); state.profile = state.role = null; renderLogin(); }

/* ---------- شاشة الدخول ---------- */
function renderLogin(message, kind) {
  const idInput = h("input", { type: "text", id: "u", dir: "ltr", autocomplete: "username", autocapitalize: "none", autocorrect: "off", spellcheck: "false", required: true });
  const pwInput = h("input", { type: "password", id: "p", dir: "ltr", autocomplete: "current-password", required: true });
  const msg = h("div", { id: "login-msg" });
  if (message) msg.append(h("div", { class: "msg " + (kind || "error") }, message));
  const btn = h("button", { class: "btn", type: "submit" }, "دخول");
  const form = h("form", { novalidate: true, onsubmit: async (e) => {
    e.preventDefault();
    if (!idInput.value.trim() || !pwInput.value) { msg.replaceChildren(h("div", { class: "msg error" }, "اكتب اسم المستخدم وكلمة المرور")); return; }
    btn.disabled = true; btn.textContent = "جاري الدخول...";
    msg.replaceChildren();
    const email = toEmail(idInput.value);
    const { error } = await sb.auth.signInWithPassword({ email, password: pwInput.value });
    if (error) {
      btn.disabled = false; btn.textContent = "دخول";
      msg.replaceChildren(h("div", { class: "msg error" },
        isNetworkError(error) ? "تعذّر الاتصال بالخادم، اتأكد من الإنترنت وجرّب تاني" : "اسم المستخدم أو كلمة المرور غلط"));
      return;
    }
    state.email = email;
    await boot();
  } },
    h("label", { for: "u" }, "اسم المستخدم"), idInput,
    h("label", { for: "p" }, "كلمة المرور"), pwInput,
    msg,
    h("div", { class: "form-actions" }, btn));
  mount(h("div", { class: "login-wrap" },
    h("div", { class: "login-card" },
      h("h1", null, "نظام إدارة المصنع"),
      h("p", { class: "lead" }, "سجّل دخولك بالحساب اللي صاحب المصنع عمله لك."),
      form)));
  idInput.focus();
}

/* ---------- تغيير كلمة المرور المؤقتة ---------- */
function renderChangePassword() {
  const pw1 = h("input", { type: "password", id: "n1", dir: "ltr", autocomplete: "new-password", required: true });
  const pw2 = h("input", { type: "password", id: "n2", dir: "ltr", autocomplete: "new-password", required: true });
  const msg = h("div");
  const btn = h("button", { class: "btn", type: "submit" }, "حفظ كلمة المرور");
  const form = h("form", { novalidate: true, onsubmit: async (e) => {
    e.preventDefault();
    if (pw1.value.length < 8) { msg.replaceChildren(h("div", { class: "msg error" }, "كلمة المرور لازم تكون 8 حروف على الأقل")); return; }
    if (pw1.value !== pw2.value) { msg.replaceChildren(h("div", { class: "msg error" }, "كلمتين المرور مش متطابقتين")); return; }
    btn.disabled = true; btn.textContent = "جاري الحفظ...";
    const r = await callAdmin({ action: "change_own_password", password: pw1.value });
    if (!r.ok) { btn.disabled = false; btn.textContent = "حفظ كلمة المرور"; msg.replaceChildren(h("div", { class: "msg error" }, r.error)); return; }
    // نسجّل الدخول من جديد بكلمة المرور الجديدة للتأكد إنها اشتغلت فعلًا
    const { error } = await sb.auth.signInWithPassword({ email: state.email, password: pw1.value });
    if (error) { await sb.auth.signOut(); renderLogin("كلمة المرور اتغيرت. سجّل الدخول بيها.", "ok"); return; }
    await boot();
  } },
    h("label", { for: "n1" }, "كلمة المرور الجديدة"), pw1,
    h("div", { class: "hint" }, "8 حروف على الأقل، ومتكونش نفس الكلمة المؤقتة."),
    h("label", { for: "n2" }, "أكّد كلمة المرور"), pw2,
    msg,
    h("div", { class: "form-actions" }, btn, h("button", { class: "btn ghost", type: "button", onclick: logout }, "خروج")));
  mount(h("div", { class: "login-wrap" },
    h("div", { class: "login-card" },
      h("h1", null, "غيّر كلمة المرور"),
      h("p", { class: "lead" }, "دي أول مرة تدخل بالكلمة المؤقتة. اختار كلمة مرور خاصة بيك عشان تكمّل."),
      form)));

}

/* ---------- حساب غير مفعّل / خطأ ---------- */
function renderBlocked(text) {

    h("h1", null, "الحساب مش متاح"),
    h("p", { class: "lead" }, text),
    h("div", { class: "form-actions" }, h("button", { class: "btn", onclick: logout }, "تسجيل الخروج")))));
}

/* ---------- الرئيسية لغير المالك ---------- */
function renderHome() {
  mount(...shell(h("div", { class: "panel center-note" },
    h("h2", null, "أهلًا " + (state.profile.full_name || "")),
    h("p", null, "دورك: " + (state.role ? state.role.name_ar : "—") + "."),
    h("p", { class: "user-sub" }, "مفيش شاشات مفتوحة لدورك دلوقتي. الشاشات بتتضاف مع كل مرحلة، وصاحب المصنع هو اللي بيحدد صلاحياتك."))));
}

/* ---------- شاشة المستخدمين (للمالك) ---------- */
async function renderUsers() {
  mount(...shell(h("div", { class: "panel empty" }, "جاري تحميل المستخدمين...")));
  const [pr, rr] = await Promise.all([
    sb.from("profiles").select("id, full_name, username, is_active, must_change_password, role_id").order("created_at", { ascending: true }),
    sb.from("roles").select("id, code, name_ar, is_owner, is_active").order("created_at", { ascending: true })
  ]);
  if (pr.error || rr.error) {
    mount(...shell(h("div", { class: "panel center-note" }, h("p", null, "تعذّر تحميل المستخدمين: " + dbMessage(pr.error || rr.error)), h("button", { class: "btn", onclick: renderUsers }, "إعادة المحاولة"))));
    return;
  }
  const roles = rr.data, byId = new Map(roles.map(r => [r.id, r]));
  const assignable = roles.filter(r => r.is_active && !r.is_owner);

  const list = h("ul", { class: "user-list" });
  if (!pr.data.length) list.append(h("li", { class: "panel empty" }, "مفيش مستخدمين."));
  for (const u of pr.data) {
    const role = byId.get(u.role_id);
    const ownerRow = !!(role && role.is_owner);
    const badge = !u.is_active ? h("span", { class: "badge off" }, "معطّل")
      : u.must_change_password ? h("span", { class: "badge wait" }, "مفعّل — لسه ما غيّرش كلمة المرور المؤقتة")
      : h("span", { class: "badge on" }, "مفعّل");
    const actions = h("div", { class: "user-actions" });
    if (ownerRow) {
      actions.append(h("span", { class: "user-sub" }, "صاحب المصنع"));
    } else {
      const sel = h("select", { "aria-label": "دور " + (u.full_name || u.username || "المستخدم") },
        h("option", { value: "" }, "بدون دور"),
        assignable.map(r => h("option", { value: r.code, selected: r.id === u.role_id }, r.name_ar)));
      sel.addEventListener("change", async () => {
        if (!sel.value) { sel.value = role ? role.code : ""; return; }
        sel.disabled = true;
        const r = await callAdmin({ action: "set_role", user_id: u.id, role_code: sel.value });
        if (r.ok) { toast("تم تغيير الدور"); renderUsers(); } else { toast(r.error, "error"); sel.disabled = false; sel.value = role ? role.code : ""; }
      });
      actions.append(sel,
        h("button", { class: "btn small " + (u.is_active ? "danger" : ""), onclick: async (e) => {
          const b = e.currentTarget; b.disabled = true;
          const r = await callAdmin({ action: "set_active", user_id: u.id, is_active: !u.is_active });
          if (r.ok) { toast(u.is_active ? "تم تعطيل المستخدم" : "تم تفعيل المستخدم"); renderUsers(); } else { toast(dbMessage({ message: r.error }), "error"); b.disabled = false; }
        } }, u.is_active ? "تعطيل" : "تفعيل"),
        h("button", { class: "btn ghost small", onclick: () => openResetDialog(u) }, "كلمة مرور جديدة"));
    }
    list.append(h("li", { class: "panel user" },
      h("div", { class: "user-top" },
        h("div", null,
          h("div", { class: "user-name" }, u.full_name || "—"),
          h("div", { class: "user-sub" }, ownerRow ? "الدخول بالإيميل" : (u.username ? "اسم الدخول: " + u.username : "ما لهوش اسم دخول"))),
        badge),
      actions));
  }

  mount(...shell([
    h("div", { class: "page-head" },
      h("h2", null, "المستخدمين"),
      h("button", { class: "btn", onclick: () => openAddDialog(assignable) }, "إضافة مستخدم")),
    list
  ]));
}

function openDialog(title, lead, body) {
  const dlg = h("dialog", null, h("div", { class: "dlg" }, h("h3", null, title), lead ? h("p", { class: "user-sub", style: "margin:0 0 6px" }, lead) : null, body));
  dlg.addEventListener("close", () => dlg.remove());
  document.body.append(dlg);
  dlg.showModal();
  return dlg;
}

function openAddDialog(assignable) {
  const name = h("input", { type: "text", id: "an", autocomplete: "off", required: true });
  const user = h("input", { type: "text", id: "au", dir: "ltr", autocomplete: "off", autocapitalize: "none", spellcheck: "false", required: true });
  const role = h("select", { id: "ar", required: true }, h("option", { value: "" }, "اختار الدور"), assignable.map(r => h("option", { value: r.code }, r.name_ar)));
  const pw = h("input", { type: "text", id: "ap", dir: "ltr", autocomplete: "off", spellcheck: "false", required: true });
  const msg = h("div");
  const btn = h("button", { class: "btn", type: "submit" }, "إنشاء الحساب");
  let dlg;
  const form = h("form", { novalidate: true, onsubmit: async (e) => {
    e.preventDefault();
    const username = user.value.trim().toLowerCase();
    if (name.value.trim().length < 2) return void msg.replaceChildren(h("div", { class: "msg error" }, "اكتب اسم الموظف"));
    if (!/^[a-z0-9_]{3,20}$/.test(username)) return void msg.replaceChildren(h("div", { class: "msg error" }, "اسم الدخول: حروف إنجليزية صغيرة وأرقام و _ فقط، من 3 لـ 20 حرف"));
    if (!role.value) return void msg.replaceChildren(h("div", { class: "msg error" }, "اختار الدور"));
    if (pw.value.length < 8) return void msg.replaceChildren(h("div", { class: "msg error" }, "كلمة المرور المؤقتة لازم تكون 8 حروف على الأقل"));
    btn.disabled = true; btn.textContent = "جاري الإنشاء...";
    const r = await callAdmin({ action: "create", full_name: name.value.trim(), username, role_code: role.value, password: pw.value });
    if (!r.ok) { btn.disabled = false; btn.textContent = "إنشاء الحساب"; msg.replaceChildren(h("div", { class: "msg error" }, r.error)); return; }
    dlg.close();
    toast("تم إنشاء الحساب. اسم الدخول: " + username + " — سلّم كلمة المرور المؤقتة للموظف.");
    renderUsers();
  } },
    h("label", { for: "an" }, "اسم الموظف"), name,
    h("label", { for: "au" }, "اسم الدخول"), user,
    h("div", { class: "hint" }, "إنجليزي صغير وأرقام، مثال: ahmed أو store1"),
    h("label", { for: "ar" }, "الدور"), role,
    h("label", { for: "ap" }, "كلمة مرور مؤقتة"), pw,
    h("div", { class: "hint" }, "الموظف هيغيّرها أول ما يدخل."),
    msg,
    h("div", { class: "form-actions" }, btn, h("button", { class: "btn ghost", type: "button", onclick: () => dlg.close() }, "إلغاء")));
  dlg = openDialog("إضافة مستخدم", null, form);
  name.focus();
}

function openResetDialog(u) {
  const pw = h("input", { type: "text", id: "rp", dir: "ltr", autocomplete: "off", spellcheck: "false", required: true });
  const msg = h("div");
  const btn = h("button", { class: "btn", type: "submit" }, "حفظ");
  let dlg;
  const form = h("form", { novalidate: true, onsubmit: async (e) => {
    e.preventDefault();
    if (pw.value.length < 8) return void msg.replaceChildren(h("div", { class: "msg error" }, "كلمة المرور المؤقتة لازم تكون 8 حروف على الأقل"));
    btn.disabled = true; btn.textContent = "جاري الحفظ...";
    const r = await callAdmin({ action: "reset_password", user_id: u.id, password: pw.value });
    if (!r.ok) { btn.disabled = false; btn.textContent = "حفظ"; msg.replaceChildren(h("div", { class: "msg error" }, r.error)); return; }
    dlg.close();
    toast("تم تغيير كلمة المرور. سلّمها للموظف، وهيغيّرها أول ما يدخل.");
    renderUsers();
  } },
    h("label", { for: "rp" }, "كلمة المرور المؤقتة الجديدة"), pw,
    msg,
    h("div", { class: "form-actions" }, btn, h("button", { class: "btn ghost", type: "button", onclick: () => dlg.close() }, "إلغاء")));
  dlg = openDialog("كلمة مرور جديدة", (u.full_name || u.username || "") + " — هيتجبر يغيّرها في أول دخول.", form);
  pw.focus();
}

/* ---------- البيانات الأساسية: ألوان / مقاسات / موديلات ---------- */
const CFG = {
  colors: { tab: "colors", table: "colors", title: "الألوان", singular: "لون", order: { col: "name_ar", asc: true },
    fields: [{ key: "name_ar", label: "اسم اللون", required: true, max: 40 }],
    line: (r) => ({ name: r.name_ar, sub: "" }) },
  sizes: { tab: "sizes", table: "sizes", title: "المقاسات", singular: "مقاس", order: { col: "sort_order", asc: true },
    fields: [
      { key: "name", label: "المقاس", required: true, max: 10, dir: "ltr", hint: "مثال: S أو M أو XL أو 42" },
      { key: "sort_order", label: "الترتيب", type: "number", hint: "الأصغر بيظهر الأول. لو سيبته فاضي هيتحط في الآخر." }],
    line: (r) => ({ name: r.name, sub: "الترتيب: " + r.sort_order }) },
  models: { tab: "models", table: "models", title: "الموديلات", singular: "موديل", order: { col: "code", asc: true },
    fields: [
      { key: "code", label: "كود الموديل", required: true, max: 30, dir: "ltr", hint: "مثال: TR-001" },
      { key: "name_ar", label: "اسم الموديل", required: true, max: 80 },
      { key: "product_type", label: "نوع المنتج", max: 40, list: ["تريننج", "بنطلون رياضي", "شورت", "تيشيرت رياضي", "ملابس فرق وأندية"] },
      { key: "notes", label: "ملاحظات", max: 300 }],
    line: (r) => ({ name: r.code + " — " + r.name_ar, sub: [r.product_type, r.notes].filter(Boolean).join(" • ") }) }
};

function writeError(err) {
  const m = (err && err.message) || "";
  if (/colors_name_unique/.test(m)) return "اللون ده موجود بالفعل";
  if (/sizes_name_unique/.test(m)) return "المقاس ده موجود بالفعل";
  if (/models_code_unique/.test(m)) return "كود الموديل ده موجود بالفعل";
  if ((err && err.code === "23503") || /foreign key/i.test(m)) return "مش ممكن تحذفه لأنه مستخدم في بيانات تانية. عطّله بدل الحذف";
  if (/check constraint|violates check/.test(m)) return "اكتب قيمة صحيحة في كل الخانات المطلوبة";
  if (/row-level security|permission denied/i.test(m) || (err && err.code === "42501")) return "مش مصرّح لك بالعملية دي";
  if (isNetworkError(err)) return "تعذّر الاتصال بالخادم، جرّب تاني";
  return "العملية ما اتنفذتش";
}

async function renderCrud(cfg) {
  mount(...shell(h("div", { class: "panel empty" }, "جاري التحميل..."), cfg.tab));
  const q = await sb.from(cfg.table).select("*").order(cfg.order.col, { ascending: cfg.order.asc });
  if (q.error) {
    mount(...shell(h("div", { class: "panel center-note" }, h("p", null, "تعذّر تحميل " + cfg.title), h("button", { class: "btn", onclick: () => renderCrud(cfg) }, "إعادة المحاولة")), cfg.tab));
    return;
  }
  const rows = q.data || [];
  const list = h("ul", { class: "user-list" });
  if (!rows.length) list.append(h("li", { class: "panel empty" }, "لسه مفيش " + cfg.title + ". اضغط «إضافة " + cfg.singular + "» وابدأ."));
  for (const r of rows) {
    const ln = cfg.line(r);
    list.append(h("li", { class: "panel user" },
      h("div", { class: "user-top" },
        h("div", null, h("div", { class: "user-name" }, ln.name), ln.sub ? h("div", { class: "user-sub" }, ln.sub) : null),
        h("span", { class: "badge " + (r.is_active ? "on" : "off") }, r.is_active ? "مفعّل" : "معطّل")),
      h("div", { class: "user-actions" },
        h("button", { class: "btn ghost small", onclick: () => openForm(cfg, rows, r) }, "تعديل"),
        h("button", { class: "btn small " + (r.is_active ? "danger" : ""), onclick: async (e) => {
          const b = e.currentTarget; b.disabled = true;
          const w = await sb.update(cfg.table, r.id, { is_active: !r.is_active });
          if (w.error || !Array.isArray(w.data) || w.data.length !== 1) { toast(writeError(w.error), "error"); b.disabled = false; return; }
          toast(r.is_active ? "تم التعطيل" : "تم التفعيل"); renderCrud(cfg);
        } }, r.is_active ? "تعطيل" : "تفعيل"),
        h("button", { class: "btn danger small", onclick: () => confirmDelete(cfg, r) }, "حذف"))));
  }
  mount(...shell([
    h("div", { class: "page-head" }, h("h2", null, cfg.title), h("button", { class: "btn", onclick: () => openForm(cfg, rows, null) }, "إضافة " + cfg.singular)),
    list
  ], cfg.tab));
}

function confirmDelete(cfg, r) {
  const ln = cfg.line(r);
  const msg = h("div");
  let dlg;
  const btn = h("button", { class: "btn danger", type: "button", onclick: async () => {
    btn.disabled = true; btn.textContent = "جاري الحذف...";
    const w = await sb.remove(cfg.table, r.id);
    if (w.error || !Array.isArray(w.data) || w.data.length !== 1) {
      btn.disabled = false; btn.textContent = "احذف نهائيًا";
      msg.replaceChildren(h("div", { class: "msg error" }, writeError(w.error)));
      return;
    }
    dlg.close();
    toast("تم الحذف");
    renderCrud(cfg);
  } }, "احذف نهائيًا");
  dlg = openDialog("تأكيد الحذف", "هتحذف «" + ln.name + "» نهائيًا. العملية دي مبترجعش، وبتتسجل في سجل المراجعة. لو عايز تخفيه بس من غير ما تحذفه، استخدم «تعطيل».",
    h("div", null, msg, h("div", { class: "form-actions" }, btn, h("button", { class: "btn ghost", type: "button", onclick: () => dlg.close() }, "إلغاء"))));
}

function openForm(cfg, rows, row) {
  const inputs = {};
  const msg = h("div");
  const btn = h("button", { class: "btn", type: "submit" }, row ? "حفظ" : "إضافة");
  let dlg;
  const fieldEls = cfg.fields.map((f) => {
    const id = "f_" + f.key;
    const attrs = { type: f.type === "number" ? "number" : "text", id, autocomplete: "off", maxlength: f.max, dir: f.dir };
    if (f.type === "number") { attrs.min = "0"; attrs.max = "9999"; attrs.inputmode = "numeric"; }
    if (f.list) attrs.list = id + "_list";
    const inp = h("input", attrs);
    if (row && row[f.key] != null) inp.value = String(row[f.key]);
    inputs[f.key] = inp;
    return [h("label", { for: id }, f.label), inp,
      f.list ? h("datalist", { id: id + "_list" }, f.list.map(v => h("option", { value: v }))) : null,
      f.hint ? h("div", { class: "hint" }, f.hint) : null];
  });
  const fail = (t) => msg.replaceChildren(h("div", { class: "msg error" }, t));
  const form = h("form", { novalidate: true, onsubmit: async (e) => {
    e.preventDefault();
    const body = {};
    for (const f of cfg.fields) {
      let v = inputs[f.key].value.trim();
      if (f.type === "number") {
        if (v === "") v = row ? row[f.key] : Math.max(0, ...rows.map(r => Number(r[f.key]) || 0)) + 1;
        else if (!/^\d{1,4}$/.test(v)) return fail("الترتيب لازم يكون رقم صحيح من 0 لـ 9999");
        v = Number(v);
      } else {
        if (f.required && !v) return fail("اكتب " + f.label);
        if (!v) v = null;
      }
      body[f.key] = v;
    }
    btn.disabled = true; btn.textContent = "جاري الحفظ...";
    const w = row ? await sb.update(cfg.table, row.id, body) : await sb.insert(cfg.table, body);
    if (w.error || !Array.isArray(w.data) || w.data.length !== 1) {
      btn.disabled = false; btn.textContent = row ? "حفظ" : "إضافة";
      return fail(writeError(w.error));
    }
    dlg.close();
    toast(row ? "تم حفظ التعديل" : "تمت الإضافة");
    renderCrud(cfg);
  } }, fieldEls, msg,
    h("div", { class: "form-actions" }, btn, h("button", { class: "btn ghost", type: "button", onclick: () => dlg.close() }, "إلغاء")));
  dlg = openDialog((row ? "تعديل " : "إضافة ") + cfg.singular, null, form);
  const first = inputs[cfg.fields[0].key]; if (first) first.focus();
}

/* ---------- نقطة البداية ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return; }
  state.email = session.user.email;
  const { data: profile, error } = await sb.from("profiles")
    .select("id, full_name, username, is_active, must_change_password, role_id")
    .eq("id", session.user.id).maybeSingle();
  if (error || !profile) { renderBlocked("تعذّر تحميل بيانات حسابك. جرّب تسجّل خروج وتدخل تاني."); return; }
  state.profile = profile;
  if (!profile.is_active) { renderBlocked("حسابك مش مفعّل. كلّم صاحب المصنع."); return; }
  if (profile.must_change_password) { renderChangePassword(); return; }
  const { data: role } = await sb.from("roles").select("code, name_ar, is_owner").eq("id", profile.role_id).maybeSingle();
  state.role = role || null;
  if (role && role.is_owner) renderUsers(); else renderHome();
}
boot();
};
